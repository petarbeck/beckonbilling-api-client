    Quote:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        public_index: { type: string }
        version: { type: integer }
        status: { type: string, enum: [draft, issued, won, lost, converted] }
        customer_id: { type: string }
        recipient: { $ref: "#/components/schemas/Recipient" }
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }
        valid_until: { type: string, format: date, nullable: true }
        pdf_footer: { type: string, description: Printed footer. Was `footer_comment`. }
        reference_fields:
          type: array
          items: { $ref: "#/components/schemas/ReferenceField" }
        reverse_charge: { type: boolean }
        terms_text:
          type: string
          description: >-
            The effective terms text, snapshotted onto the document at creation
            from the organisation's selected or default terms preset. Editing or
            deleting the preset never changes an issued document.
        small_business:
          type: boolean
          description: >-
            The issuer's small-business (Kleinunternehmer) VAT exemption,
            snapshotted at creation - an issued document keeps the status that
            applied when it was issued.
        vat_exemption_note:
          type: string
          nullable: true
          description: >-
            The statutory sentence to print when `small_business` is true; null
            otherwise. **An exempt document must show a single total and this
            note INSTEAD of a net/VAT breakdown** - rendering it like an ordinary
            0 % document is legally wrong. The citation differs per issuer
            country (AT, DE, CH, plus a neutral fallback) and follows the
            organisation's language, so print it as given rather than deriving
            your own.
        deposit_type: { type: string, enum: [none, percent, amount], default: none }
        deposit_value: { type: number, description: Percent 0-100 for `percent`, else a EUR amount. }
        deposit_amount: { type: number, description: "Resolved down payment, capped to [0, gross_total]." }
        remaining_amount: { type: number, description: gross_total minus deposit_amount. }
        net_total: { type: number }
        tax_total: { type: number }
        gross_total: { type: number }

    QuoteInput:
      type: object
      additionalProperties: true
      properties:
        document_term_id:
          type: string
          writeOnly: true
          description: >-
            LOAD a Bedingungen preset: its text and day count are copied onto the
            document, which then owns its own snapshot. Write-only on purpose -
            nothing records which preset was used, because the document's terms
            are editable afterwards and a stored reference would go on naming a
            preset whose text no longer applies.
        customer_id: { type: string }
        pdf_footer: { type: string, description: Printed footer. Was `footer_comment`. }
        meta_fields:
          type: array
          items: { $ref: "#/components/schemas/ReferenceField" }
        reverse_charge: { type: boolean }
        valid_until:
          type: string
          format: date
          description: >-
            Omit to let the organisation's default terms preset set the validity
            window. An organisation with no default preset falls back to its
            quote validity setting.
        version: { type: integer, minimum: 1, maximum: 99 }
        status: { type: string, enum: [issued, won, lost] }
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }

    QuoteList:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Quote" }

