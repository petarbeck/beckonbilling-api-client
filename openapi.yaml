    CustomerList:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Customer" }

    ArticleCategory:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        label: { type: string }
        fibu_code: { type: string }

    ArticleCategoryList:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/ArticleCategory" }

    Article:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        created_by: { type: string, format: uuid, nullable: true, readOnly: true, description: "Uuid of the user who created this record; null = system-generated." }
        created_by_name: { type: string, readOnly: true, description: "Display name of the creator; empty string when created_by is null." }
        title: { type: string }
        description: { type: string }
        price: { type: number }
        tax_percent: { type: number }
        unit:
          type: string
          description: >-
            Default short unit for lines created from this article, e.g. "h",
            "Stk.". Resolved against the organisation's units (`GET /units`); a
            value it does not stock yet is added to the vocabulary rather than
            refused, and what comes back is the vocabulary's spelling. Over 32
            characters answers 422 `unit_too_long`.
        article_group_id: { type: string }
        group_label:
          type: string
          readOnly: true
          description: The category's name, resolved server-side. Empty when uncategorised.
        fibu_code: { type: string }
        commission_eligible: { type: boolean }
        supply_type:
          type: string
          enum: ["", service, goods]
          description: >-
            Service or goods, inherited by lines created from this article. It
            decides which sentence a cross-border document prints - see
            `Position.supply_type`. Empty behaves as `service`.
        billing_mode:
          type: string
          enum: [one_time, recurring]
          description: >-
            The default modality for a quote line created from this article: a
            single charge, or a fee that repeats.
        recurring_interval:
          type: string
          enum: ["", monthly, quarterly, yearly]
          description: Only meaningful while `billing_mode` is `recurring`; empty otherwise.
        variant_count:
          type: integer
          readOnly: true
          description: >-
            How many live variants this article has. 0 means the article is used
            as it stands. Read `GET /articles/{id}/variants` for them.

    ArticleInput:
      type: object
      additionalProperties: true
      description: >-
        NOTE: `?strict=1` does NOT validate this endpoint's body - it declares no
        key list, so an unrecognised key is silently discarded here even with the
        flag on. See the strict-mode section of the introduction.
      properties:
        title: { type: string }
        description: { type: string }
        price: { type: number }
        tax_percent:
          type: number
          description: >-
            Percentage, e.g. 20. Omitted on CREATE, it defaults to the
            organisation's own default rate - which may legitimately be 0 for a
            Kleinunternehmer, so never fold a 0 into a fallback.
        unit:
          type: string
          description: >-
            Resolved against the organisation's units (`GET /units`); a value
            it does not stock yet is added to the vocabulary rather than
            refused. What comes back is the vocabulary's spelling. Over 32
            characters answers 422 `unit_too_long`.
        article_group_id: { type: string }
        fibu_code: { type: string }
        commission_eligible: { type: boolean }
        supply_type: { type: string, enum: ["", service, goods] }
        billing_mode: { type: string, enum: [one_time, recurring] }
        recurring_interval: { type: string, enum: ["", monthly, quarterly, yearly] }

    ArticleList:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Article" }

    ArticleVariant:
      type: object
      additionalProperties: true
      description: >-
        A named set of OVERRIDES on a catalog article - "Premium", "Klein",
        "Kleinunternehmer". Every override field is genuinely nullable: null
        means the article's own value is inherited, and a value - INCLUDING 0 -
        is a real override. A variant that overrides nothing produces exactly
        what the plain article produces.
      properties:
        id: { type: string }
        article_id: { type: string, readOnly: true, description: The article this variant belongs to. Immutable. }
        created_by: { type: string, format: uuid, nullable: true, readOnly: true, description: "Uuid of the user who created this record; null = system-generated." }
        created_by_name: { type: string, readOnly: true, description: "Display name of the creator; empty string when created_by is null." }
        label: { type: string, description: What this variant is called. Required, never inherited. }
        sort_order: { type: integer }
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        price: { type: number, nullable: true, description: "Net unit price. 0 is a real price; null means inherit." }
        tax_percent: { type: number, nullable: true, description: "Percentage, e.g. 20. 0 is a real rate; null means inherit." }
        unit: { type: string, nullable: true }
        fibu_code: { type: string, nullable: true }
        # Nullability is `nullable: true`, the way every other nullable field in
        # this file expresses it - NOT a `null` member in the enum. Listing null
        # there while `type` says `string` names a value the type forbids, so a
        # strict reader makes exactly the branch that carries the meaning
        # ("clear this override") unreachable. The enum names the real values;
        # the keyword beside it says the value may be absent.
        supply_type: { type: string, nullable: true, enum: [service, goods] }
        billing_mode: { type: string, nullable: true, enum: [one_time, recurring] }
        recurring_interval: { type: string, nullable: true, enum: [monthly, quarterly, yearly] }
        commission_eligible: { type: boolean, nullable: true }

    ArticleVariantInput:
      type: object
      additionalProperties: true
      description: >-
        Send only what this variant should OVERRIDE. An omitted field stays
        inherited; an explicit `null` CLEARS an override back to inherited.
      properties:
        label: { type: string }
        sort_order: { type: integer }
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        price: { type: number, nullable: true }
        tax_percent: { type: number, nullable: true }
        unit: { type: string, nullable: true }
        fibu_code: { type: string, nullable: true }
        supply_type: { type: string, nullable: true }
        billing_mode: { type: string, nullable: true }
        recurring_interval: { type: string, nullable: true }
        commission_eligible: { type: boolean, nullable: true }
      required: [label]

    ArticleVariantList:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/ArticleVariant" }

    Quote:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        recipient_kind:
          type: string
          enum: [customer, lead, supplier, partner]
          description: >-
            Who this quote is addressed to. `customer` is the normal case and
            covers a freely typed recipient too. `lead` is QUOTE-ONLY - an
            outbound invoice accepts only customer, supplier and partner, since
            an invoice always names a customer.
        recipient_ref_id:
          type: string
          nullable: true
          description: >-
            Uuid of the record named by `recipient_kind`, or null for a
            customer-addressed quote. The printed recipient block is a
            SNAPSHOT taken from that record when it was assigned - editing the
            lead, supplier or partner afterwards never rewrites an existing
            quote.
        created_by: { type: string, format: uuid, nullable: true, readOnly: true, description: "Uuid of the user who created this record; null = system-generated." }
        created_by_name: { type: string, readOnly: true, description: "Display name of the creator; empty string when created_by is null." }
        public_index: { type: string }
        version: { type: integer }
        status: { type: string, enum: [draft, issued, won, lost, converted] }
        customer_id: { type: string }
        customer_label:
          type: string
          readOnly: true
          description: >-
            The LIVE customer's display name - what a list should show, since it
            follows a later rename. `recipient` is the frozen snapshot the
            document prints and deliberately does not. Falls back to the snapshot
            when the quote has no linked customer.
        partner_id: { type: string, nullable: true, description: Commission partner. }
        project_id: { type: string, nullable: true }
        recipient: { $ref: "#/components/schemas/Recipient" }
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }
        valid_until: { type: string, format: date, nullable: true }
        email_text: { type: string, description: Cover-mail text. Also emitted as `intro_text` (legacy alias). }
        pdf_footer: { type: string, description: Printed footer. Was `footer_comment`, which is no longer emitted. }
        document_ids:
          type: array
          items: { type: string }
          description: UUIDs of the documents attached when this quote is emailed.
        document_send_mode:
          type: string
          enum: [link, attach]
          description: >-
            How the document reaches the customer - a link to the public page, or
            the PDF attached. A quote always carries a concrete value: it is
            resolved at creation from the customer, else the organisation. Only a
            CUSTOMER may leave this open.
        reference_fields:
          type: array
          items: { $ref: "#/components/schemas/ReferenceField" }
        reverse_charge: { type: boolean }
        terms_text:
          type: string
          description: >-
            The effective terms text, snapshotted onto the document at creation
            from the selected or default document template. Editing or deleting
            the template never changes an issued document. Labelled
            "Angebotsbedingungen" on a quote.
        payment_terms_text:
          type: string
          description: >-
            The SECOND terms text, snapshotted the same way and printed AFTER
            `terms_text`. On a quote it holds the down-payment terms
            ("Anzahlungsbedingungen"), and **it is printed only when the quote
            actually carries a down payment** - `deposit_type` set AND
            `deposit_value` above zero. A quote at `percent` / `0` shows no
            deposit line in its summary, so printing a paragraph about one would
            describe something invisible.


            Converting a quote does NOT carry this field onto the invoice: on a
            quote it means the deposit terms, on an invoice the payment terms,
            so copying it across would move one meaning into another.
        small_business:
          type: boolean
          description: >-
            The issuer's small-business (Kleinunternehmer) VAT exemption,
            snapshotted at creation - an issued document keeps the status that
            applied when it was issued.
        vat_exemption_note:
          type: string
          nullable: true
          description: >-
            The statutory sentence to print when `small_business` is true; null
            otherwise. **An exempt document must show a single total and this
            note INSTEAD of a net/VAT breakdown** - rendering it like an ordinary
            0 % document is legally wrong. The citation differs per issuer
            country (AT, DE, CH, plus a neutral fallback) and follows the
            organisation's language, so print it as given rather than deriving
            your own.
        deposit_type:
          type: string
          enum: [none, percent, amount, goods_percent, service_percent]
          default: none
          description: >-
            Down payment (Anzahlung). `percent` and `amount` apply to the whole
            ONE-TIME portion of the quote; `goods_percent` and `service_percent`
            apply a percentage to only the goods or only the service lines,
            decided per line by its `supply_type` (a line that states none counts
            as a service). Recurring lines are never part of a down payment, and
            the computed amount is capped by whichever basis applies.
        deposit_value:
          type: number
          description: >-
            A percent 0-100 for `percent`, `goods_percent` and `service_percent`;
            a EUR amount for `amount`.
        deposit_amount:
          type: number
          description: >-
            Resolved down payment, capped to [0, basis] - the basis being the
            one-time gross total, or only its goods or service part for the two
            supply-specific types. It is NOT capped to `gross_total`, which
            includes recurring lines a down payment never covers.
        remaining_amount:
          type: number
          description: >-
            The one-time gross total minus `deposit_amount` - not `gross_total`
            minus it, since recurring lines sit outside the down payment.
        net_total: { type: number }
        tax_total: { type: number }
        gross_total: { type: number }
        converted_outbound_invoice_id:
          type: string
          nullable: true
          readOnly: true
          description: >-
            The invoice this quote was converted into, once it was. **It is
            single-valued**, so it cannot describe a quote billed in stages: a
            down payment and a final invoice are two invoices. Read
            `OutboundInvoice.quote_id` to find all of them.
        converted_recurring_invoice_id:
          type: string
          nullable: true
          readOnly: true
          description: >-
            The recurring template its recurring lines produced, if any. The v1
            convert action never creates one - see `POST /quotes/{id}/convert`.
        accepted_at: { type: string, format: date-time, nullable: true, readOnly: true, description: When the customer accepted it on the public page. }
        has_signature: { type: boolean, readOnly: true, description: Whether that acceptance carries a drawn signature. }
        rejected_at: { type: string, format: date-time, nullable: true, readOnly: true }
        rejection_comment: { type: string, readOnly: true }
        view_count: { type: integer, readOnly: true, description: Opens of the public quote page. }
        download_count: { type: integer, readOnly: true }

    QuoteInput:
      type: object
      additionalProperties: true
      description: >-
        **`document_term_id` was RETIRED.** Sending that key - with any value,
        including null or an empty string - answers 422
        `document_term_id_retired`. Use `document_template_id`. It is refused
        rather than ignored on purpose: ignoring it would leave the document on
        the default template and silently move `valid_until`, so a caller who
        thought they had chosen a preset would get a different date.
      properties:
        recipient_kind:
          type: string
          enum: [customer, lead, supplier, partner]
          description: >-
            Address this quote to something other than a customer. Pass
            `recipient_ref_id` with it: the recipient block is then snapshotted
            server-side from that record and `customer_id` is cleared. A kind
            this document does not accept is REFUSED with 422
            `recipient_kind_invalid` - it is never silently ignored, which would
            leave a document with no recipient at all. `lead` is quote-only.
        recipient_ref_id:
          type: string
          description: >-
            Uuid of the lead, supplier or partner named by `recipient_kind`.
            Unknown and foreign uuids answer identically with 404
            `recipient_not_found`.
        document_template_id:
          type: string
          writeOnly: true
          description: >-
            LOAD a document template ("Vorlage"): its `terms_text`,
            `payment_terms_text` and day count are copied onto the document,
            which then owns its own snapshot. Write-only on purpose - nothing
            records which template was used, because the document's terms are
            editable afterwards and a stored reference would go on naming a
            template whose text no longer applies. Discover the ids with
            `GET /document-templates?kind=quote`.


            It carries texts and days ONLY. A template's default attachments
            (`document_ids`) are applied when a document is CREATED, never by
            naming a template on one that already exists.


            Replaced `document_term_id`, which now answers 422 - see this
            schema's description.
        terms_text:
          type: string
          description: >-
            Type the terms yourself. Applied AFTER `document_template_id`, so
            sending both loads the template and then keeps your wording - which
            is what "pick a template and edit it in one request" has to mean.
        payment_terms_text:
          type: string
          description: >-
            The second terms text - on a quote, the down-payment terms. Same
            precedence as `terms_text`: applied after the template, so it
            survives loading one in the same request. Printed only when the
            quote carries a real down payment (see the output schema).
        customer_id:
          type: string
          description: >-
            Assigning a customer SNAPSHOTS their recipient, reverse-charge flag,
            commission partner and document defaults onto the quote - unless
            the same request states them explicitly, which wins. A customer from
            another organisation is refused with 404 `customer_not_found`.
        recipient:
          allOf: [ { $ref: "#/components/schemas/Recipient" } ]
          description: >-
            Type the recipient instead of naming a customer. Wins over the
            customer's snapshot when both are sent. A `type: consumer` recipient
            has its printed name composed from salutation + person_name, and
            carries no `attention` line.
        recipient_email: { type: string, description: Where this quote is emailed. Wins over the customer's address. }
        recipient_email_name: { type: string }
        partner_id:
          type: string
          description: >-
            Commission partner for this quote. A foreign partner is refused; an
            empty value clears it. Otherwise inherited from the customer.
        project_id: { type: string, description: Empty clears the link. A foreign project is refused. }
        document_ids:
          type: array
          items: { type: string }
          description: >-
            The exact set of attached documents (empty = attach none). Omit to
            keep the organisation's auto-include selection. A document belonging
            to another organisation is refused.
        document_send_mode: { type: string, enum: [link, attach] }
        email_text: { type: string, description: Cover-mail text for this quote. }
        pdf_footer: { type: string, description: Printed footer. Was `footer_comment`. }
        reference_fields:
          type: array
          items: { $ref: "#/components/schemas/ReferenceField" }
        meta_fields:
          type: array
          items: { $ref: "#/components/schemas/ReferenceField" }
          description: Legacy alias of `reference_fields`. Sending both, this one wins.
        reverse_charge: { type: boolean }
        deposit_type:
          type: string
          enum: [none, percent, amount, goods_percent, service_percent]
          description: See `Quote.deposit_type`.
        deposit_value:
          type: number
          description: >-
            A percent 0-100 for `percent`, `goods_percent` and `service_percent`;
            a EUR amount for `amount`.
        valid_until:
          type: string
          format: date
          description: >-
            Omit to let the document template set the validity window - the
            customer's own day count first (when their switch is on), then the
            customer's template, then the organisation's default template, then
            a 30-day fallback. An explicit value here always wins over all of
            them; send an empty string to clear it.
        version: { type: integer, minimum: 1, maximum: 99, description: Forced to 1 while the quote is a draft. }
        status:
          type: string
          enum: [issued, won, lost]
          description: >-
            Outcome tracking only. These three may be set on one another; `draft`
            and `converted` are never settable and a value outside this set is
            ignored rather than refused.
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }

    QuoteList:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Quote" }

    OutboundInvoice:
      type: object
      additionalProperties: true
      properties:
        recipient_kind:
          type: string
          enum: [customer, supplier, partner]
          description: >-
            Who this invoice is addressed to. `customer` is the normal case.
            Note the quote accepts a fourth kind, `lead`; an invoice never does,
            since it always names a customer - use `POST /leads/{id}/complete`
            first. Served since the field existed, documented from 0.11.0.
        recipient_ref_id:
          type: string
          nullable: true
          description: >-
            Uuid of the supplier or partner named by `recipient_kind`, or null
            for a customer-addressed invoice. The printed recipient block is a
            SNAPSHOT taken when it was assigned.
        payment_mode:
          type: string
          enum: [direct_debit, all, individual]
          description: >-
            How this record is settled. `direct_debit` means WE collect it under
            a SEPA mandate and no way to pay is offered at all; `all` means the
            customer pays by the organisation's standard setting; `individual`
            means they pay by the ways in `payment_methods`. Direct debit is
            deliberately not one of `payment_methods` - it is the level above
            them, so "collect and also offer a transfer" cannot be expressed.
        payment_methods:
          type: array
          items: { type: string, enum: [online, transfer, cash] }
          description: >-
            The individual selection, used when `payment_mode` is `individual`.
            Kept when the mode is anything else, so a record returns to these
            ways if a mandate is revoked. Online payment is only ever offered
            when the organisation has a working Stripe configuration.
        invoice_scope:
          type: string
          enum: [full, deposit, final]
          readOnly: true
          default: full
          description: >-
            Which PART of its quote this invoice bills. `full` is the whole
            thing and is what every invoice not created as a staged one reports,
            including every invoice that existed before this field did.
            `deposit` is a down payment; `final` is the remainder after one.


            **Do not add a deposit and a final invoice together as if each were
            the whole amount.** They already sum correctly: the final invoice
            lists the full one-time lines and then carries a NEGATIVE deduction
            line per tax rate for what the down payment already covered, so its
            own `gross_total` is the remainder, and deposit gross + final gross
            equals the quote's one-time gross. The deduction is visible in
            `positions` as a line with a negative `price` - do not filter those
            out as if they were an error.


            Set by `POST /quotes/{id}/convert` via its `scope`; it is not a body
            key on this endpoint.
        quote_id:
          type: string
          nullable: true
          readOnly: true
          description: >-
            The quote this invoice was created from, or null. This is the FULL
            trail: one quote may produce several invoices (a down payment and a
            final one), which is exactly what `Quote.converted_outbound_invoice_id`
            cannot express, holding only one. To find every invoice belonging to
            a quote, match on this field rather than reading that one.
        id: { type: string }
        created_by: { type: string, format: uuid, nullable: true, readOnly: true, description: "Uuid of the user who created this record; null = system-generated (e.g. a recurring run or a dunning fee invoice)." }
        created_by_name: { type: string, readOnly: true, description: "Display name of the creator; empty string when created_by is null." }
        public_index: { type: string }
        status: { type: string, enum: [draft, issued] }
        customer_id: { type: string }
        recipient: { $ref: "#/components/schemas/Recipient" }
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }
        issue_date: { type: string, format: date, nullable: true }
        due_date: { type: string, format: date, nullable: true }
        due_days:
          type: integer
          nullable: true
          readOnly: true
          description: >-
            The payment term in calendar days, DERIVED as `due_date -
            issue_date`. Null while either date is unset - an invoice with no due
            date has no term, and 0 would read as "due today". Writable under the
            same name on the input, where it MOVES the due date.
        customer_label:
          type: string
          readOnly: true
          description: >-
            The LIVE customer's display name - what a list should show, since it
            follows a later rename. `recipient` and `customer_name` are the
            frozen snapshot the document prints and deliberately do not.
        project_id: { type: string, nullable: true }
        document_send_mode:
          type: string
          enum: [link, attach]
          description: >-
            How the document reaches the customer - a link to the public page, or
            the PDF attached. An invoice always carries a concrete value: it is
            resolved at creation from the customer, else the organisation. Only a
            CUSTOMER may leave this open.
        paid: { type: boolean }
        paid_amount: { type: number }
        paid_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Settlement date, derived and never writable. Null until the invoice is
            fully paid, then the date of the payment that settled it (the payment's
            own date, not the recording time). Cleared again if the invoice falls
            back to partially paid.
        remaining_amount:
          type: number
          description: >-
            What is still outstanding on this document. Zero once it is fully
            paid AND zero once it is cancelled: a storno is not a receivable,
            because the credit note that reverses it carries whatever is still
            owed in either direction. Do not re-derive it as gross minus paid -
            that subtraction reports a cancelled invoice as money outstanding.
        cancelled:
          type: boolean
          description: >-
            Whether this invoice was reversed by a cancellation credit note. A
            cancelled invoice keeps its number and its `issued` status - it stays
            part of the record - but owes nothing.
        settlement_status:
          type: string
          enum: [draft, open, partially_paid, paid, cancelled]
          description: >-
            The settlement state as one value, so it never has to be rebuilt out
            of `status` + `cancelled` + `paid`. Prefer it over `paid` whenever
            you need to know whether money is still expected. On a credit note,
            `open` means a refund is still owed to the customer rather than
            money expected from them.
        cancels_outbound_invoice_id:
          type: string
          nullable: true
          description: On a cancellation credit note, the invoice it reverses.
        cancels_outbound_invoice_number:
          type: string
          description: >-
            The human document number behind `cancels_outbound_invoice_id`, so
            the pair can be named without a second request. Empty when unrelated.
        cancelled_by_outbound_invoice_id:
          type: string
          nullable: true
          description: >-
            The reverse direction: on a cancelled invoice, the credit note that
            cancelled it. Null unless this document is cancelled.
        cancelled_by_outbound_invoice_number:
          type: string
          description: The human document number behind `cancelled_by_outbound_invoice_id`.
        reverse_charge: { type: boolean }
        terms_text:
          type: string
          description: >-
            The effective terms text, snapshotted onto the document at creation
            from the selected or default document template. Editing or deleting
            the template never changes an issued document. Labelled
            "Rechnungsbedingungen" on an invoice, and empty by default - the
            sentence about paying lives in `payment_terms_text`.
        payment_terms_text:
          type: string
          description: >-
            The SECOND terms text, snapshotted the same way and printed AFTER
            `terms_text`. On an invoice these are the payment terms
            ("Zahlungsbedingungen") - the "payable by {due_date}" sentence - so
            an invoice that used to carry its terms in `terms_text` now
            typically carries them here. Render both, in that order.
        small_business:
          type: boolean
          description: >-
            The issuer's small-business (Kleinunternehmer) VAT exemption,
            snapshotted at creation - an issued document keeps the status that
            applied when it was issued.
        vat_exemption_note:
          type: string
          nullable: true
          description: >-
            The statutory sentence to print when `small_business` is true; null
            otherwise. **An exempt document must show a single total and this
            note INSTEAD of a net/VAT breakdown** - rendering it like an ordinary
            0 % document is legally wrong. The citation differs per issuer
            country (AT, DE, CH, plus a neutral fallback) and follows the
            organisation's language, so print it as given rather than deriving
            your own.
        sent_at: { type: string, format: date-time, nullable: true }
        payment_methods_effective:
          type: array
          readOnly: true
          items: { type: string, enum: [online, transfer, cash] }
          description: >-
            The RESOLVED ways to pay THIS document, which is what to render:
            empty under `direct_debit` (we collect, so the customer does
            nothing), the organisation's own defaults under `all`, the document's
            clipped selection under `individual`. Resolved server-side because
            `all` needs the organisation - re-deriving it would be a second
            definition of a money-facing rule. Never render `payment_method`.
        payment_method:
          type: string
          readOnly: true
          description: >-
            LEGACY and frozen - it reads `BANK_TRANSFER` on every row ever
            written, including invoices collected by direct debit. Kept only
            because v1 readers still expect the key. Read `payment_mode` +
            `payment_methods_effective` instead.
        stripe_payment_link_url:
          type: string
          readOnly: true
          description: The online payment link, when the document offers one. Empty otherwise.
        public_link:
          type: string
          readOnly: true
          description: >-
            The customer-facing page for this invoice. Empty before it is issued.
            Its PDF and attachments stop being downloadable 90 days after the
            issue date.
        net_total: { type: number }
        tax_total: { type: number }
        gross_total: { type: number }
        partner_id:
          type: string
          nullable: true
          description: >-
            Commission partner. **Commission accrues to THIS field, not to the
            customer's partner** - the customer's is copied here when one is
            assigned, and may then be overridden or cleared for this one invoice.
        send_error:
          type: string
          description: >-
            Present only if issue/send mailing failed. The invoice IS issued - the
            send is best-effort and never fails the issue, which is exactly why
            this has to be read rather than the status code.
        payment_link_error:
          type: string
          description: >-
            Present only if minting the Stripe payment link failed. The invoice IS
            issued, but offers online payment with no link behind it, so the
            customer cannot pay the way the document tells them to.

    OutboundInvoiceInput:
      type: object
      additionalProperties: true
      description: >-
        A draft accepts everything below. An ISSUED invoice accepts the same
        keys EXCEPT the recipient-assignment ones (`customer_id`,
        `recipient_kind`, `recipient_ref_id`), which only apply while it is still
        a draft - an issued document's recipient is a snapshot.


        **`document_term_id` was RETIRED.** Sending that key - with any value,
        including null or an empty string - answers 422
        `document_term_id_retired`. Use `document_template_id`. It is refused
        rather than ignored on purpose: ignoring it would leave the document on
        the default template and silently move `due_date`, so a caller who
        thought they had chosen a preset would get a different date.
      properties:
        payment_mode: { type: string, enum: [direct_debit, all, individual] }
        payment_methods:
          type: array
          items: { type: string, enum: [online, transfer, cash] }
        document_send_mode: { type: string, enum: [link, attach] }
        document_template_id:
          type: string
          writeOnly: true
          description: >-
            LOAD a document template ("Vorlage"): its `terms_text`,
            `payment_terms_text` and day count are copied onto the document,
            which then owns its own snapshot. Write-only on purpose - nothing
            records which template was used, because the document's terms are
            editable afterwards and a stored reference would go on naming a
            template whose text no longer applies. Discover the ids with
            `GET /document-templates?kind=invoice` - note the kind is `invoice`,
            not `outbound_invoice`.


            It carries texts and days ONLY. A template's default attachments
            (`document_ids`) are applied when a document is CREATED, never by
            naming a template on one that already exists.


            Replaced `document_term_id`, which now answers 422 - see this
            schema's description.
        terms_text:
          type: string
          description: >-
            Type the terms yourself. Applied AFTER `document_template_id`, so
            sending both loads the template and then keeps your wording.
        payment_terms_text:
          type: string
          description: >-
            The second terms text - on an invoice, the payment terms, printed
            after `terms_text`. Same precedence: applied after the template, so
            it survives loading one in the same request.
        due_days:
          type: integer
          minimum: 0
          description: >-
            Payment term in days, counted from the issue date; it SETS
            `due_date`. `0` is a real value meaning due immediately, so send it
            as a number rather than leaving it out. An explicit `due_days` beats
            the day count of a `document_template_id` in the same request.


            **This key was accepted and silently ignored until portal v1.4.x.**
            It was read only to switch the terms branch off and then never
            applied, so a request CARRYING it moved nothing - neither the key
            itself nor the days of a template sent beside it, because
            its mere presence disabled that branch. A request without it was
            unaffected, so a preset alone always worked. A client that has been
            sending it as a no-op will now find the due date moving.
            `due_date` itself is NOT an input - it is read-only.
        customer_id:
          type: string
          description: >-
            Draft only. Assigning a customer SNAPSHOTS their recipient, addresses,
            reverse-charge flag, commission partner, payment methods, delivery
            mode and document defaults onto the invoice - unless the same
            request states them explicitly, which wins. A customer from another
            organisation is refused with 404.
        recipient_kind:
          type: string
          enum: [customer, supplier, partner]
          description: >-
            Draft only. Bill someone who is not a customer - the path a partner
            commission credit note takes. `supplier` or `partner` snapshots that
            record's address and bank details from `recipient_ref_id`, and
            deliberately CLEARS both `customer_id` and `partner_id`: a credit
            note to a partner must never itself accrue commission.
        recipient_ref_id:
          type: string
          description: The supplier's or partner's UUID; required when `recipient_kind` is one of those.
        recipient:
          allOf: [ { $ref: "#/components/schemas/Recipient" } ]
          description: The printed recipient block, overriding whatever the customer snapshot supplied.
        recipient_email: { type: string, description: Where the invoice is emailed. }
        recipient_email_name: { type: string }
        cc_email: { type: string }
        cc_email_name: { type: string }
        recipient_account_holder:
          type: string
          description: >-
            Where money goes OUT to, on a credit note that will be paid by SEPA
            credit transfer. These three win over the linked customer's own bank
            details.
        recipient_iban: { type: string }
        recipient_bic: { type: string }
        partner_id:
          type: string
          description: >-
            Commission partner for this invoice. Empty CLEARS it, which is how you
            stop an inherited one; a foreign partner is refused. Send it AFTER
            (or with) `customer_id` - assigning a customer seeds it first, then
            this overrides.
        project_id: { type: string, description: Empty clears the link. A foreign project is refused. }
        document_ids:
          type: array
          items: { type: string }
          description: >-
            The exact set of attached documents (empty = attach none). Omit to
            keep the organisation's auto-include selection. A document belonging
            to another organisation is refused.
        service_period: { type: string, description: The Leistungszeitraum printed on the document. }
        tax_label: { type: string, description: Overrides the printed VAT caption. Blank derives "Steuer"/"Tax". }
        email_text: { type: string, description: Cover-mail text for this invoice. }
        pdf_footer: { type: string, description: Printed footer. Was `footer_comment`. }
        pdf_note: { type: string, description: A note printed on the document. Was `invoice_comment`. }
        payment_qr_code: { type: boolean, description: Print the EPC/Girocode next to the bank details. }
        reverse_charge: { type: boolean }
        reference_fields:
          type: array
          items: { $ref: "#/components/schemas/ReferenceField" }
        meta_fields:
          type: array
          items: { $ref: "#/components/schemas/ReferenceField" }
          description: Legacy alias of `reference_fields`; whichever is present is used.
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }

    OutboundInvoiceList:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/OutboundInvoice" }

    RecurringInvoice:
      type: object
      additionalProperties: true
      properties:
        service_period_mode:
          type: string
          enum: [current, previous, ahead, behind, none]
          description: >-
            Which period the generated invoice states as its Leistungszeitraum.
            `current` and `previous` NAME a calendar period and print its name -
            with a monthly schedule `2027/07`, with a yearly one `2027`.
            `ahead` and `behind` state a SPAN either side of the issue date and
            always print a date range, because a term that does not follow the
            calendar has no name: a yearly schedule issued on 2027-07-01 gives
            `01.07.2027 - 30.06.2028` for `ahead` (prepaid) and
            `01.07.2026 - 30.06.2027` for `behind` (in arrears). A period ends
            the day before the next one starts, so consecutive invoices abut
            exactly. `none` states no period at all.
        payment_mode:
          type: string
          enum: [direct_debit, all, individual]
          description: >-
            How this record is settled. `direct_debit` means WE collect it under
            a SEPA mandate and no way to pay is offered at all; `all` means the
            customer pays by the organisation's standard setting; `individual`
            means they pay by the ways in `payment_methods`. Direct debit is
            deliberately not one of `payment_methods` - it is the level above
            them, so "collect and also offer a transfer" cannot be expressed.
        payment_methods:
          type: array
          items: { type: string, enum: [online, transfer, cash] }
          description: >-
            The individual selection, used when `payment_mode` is `individual`.
            Kept when the mode is anything else, so a record returns to these
            ways if a mandate is revoked. Online payment is only ever offered
            when the organisation has a working Stripe configuration.
        id: { type: string }
        created_by: { type: string, format: uuid, nullable: true, readOnly: true, description: "Uuid of the user who created this TEMPLATE; null = system-generated. Invoices the automation agent generates from it are always system-created (created_by null), regardless of who created the template." }
        created_by_name: { type: string, readOnly: true, description: "Display name of the creator; empty string when created_by is null." }
        label: { type: string }
        customer_id: { type: string }
        customer_label: { type: string, readOnly: true, description: The LIVE customer's display name. }
        partner_id:
          type: string
          nullable: true
          description: >-
            Commission partner, propagated onto every generated invoice - where
            it, not the customer's, is what commission accrues to.
        project_id: { type: string, nullable: true }
        active: { type: boolean }
        interval: { type: string, enum: [daily, weekly, monthly, yearly] }
        first_run_date:
          type: string
          format: date
          nullable: true
          description: >-
            The schedule's ANCHOR, not a one-off first event: it fixes the day of
            the month (or of the week) that EVERY future run lands on, and moving
            it moves them all. A monthly or yearly schedule anchored on the 31st
            is clamped to the end of shorter months.
        next_run_at: { type: string, format: date-time, nullable: true, description: Derived, read-only. }
        due_days: { type: integer, description: Payment term handed to each generated invoice. }
        payment_method:
          type: string
          enum: [BANK_TRANSFER, DIRECT_DEBIT]
          description: LEGACY. Read `payment_mode` instead.
        document_send_mode:
          type: string
          enum: ["", link, attach]
          description: >-
            How generated invoices reach the customer. A template MAY stay EMPTY,
            unlike a quote or an invoice: it is a rule, not a record, so leaving
            it open lets each generated invoice resolve delivery from the customer
            and then the organisation. A concrete value here overrides both.
        tax_label: { type: string }
        reverse_charge: { type: boolean }
        credit_note: { type: boolean, readOnly: true, description: "Derived - true when the positions net negative." }
        terms_text:
          type: string
          description: >-
            The effective terms text. Copied onto every invoice this template
            generates, alongside the attached documents.
        payment_terms_text:
          type: string
          description: >-
            The SECOND terms text - the payment terms - copied onto every
            generated invoice too, and printed AFTER `terms_text`. Same pair of
            names as on a one-off invoice.
        email_text: { type: string, description: Cover-mail intro copied onto every generated invoice. }
        email_body: { type: string, description: Cover-mail body. }
        pdf_footer: { type: string }
        pdf_note: { type: string }
        reference_fields:
          type: array
          items: { $ref: "#/components/schemas/ReferenceField" }
        document_ids:
          type: array
          readOnly: true
          items: { type: integer }
          description: >-
            Documents attached to every generated invoice. **The one place this
            API exposes INTERNAL INTEGER ids rather than UUIDs** - a wire wart
            that predates the convention and is not settable through this
            contract. Do not build on these values; manage the attachments in the
            portal.
        last_generated_period:
          type: string
          readOnly: true
          description: The period key the last successful run consumed, which is what stops it billing twice.
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }
        last_run_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: >-
            The last time the portal's automation agent actually ATTEMPTED to run
            this template (generate + send) - never set on a run that was skipped
            because the current period was already generated. Null before the
            first attempt.
        last_run_error:
          type: string
          readOnly: true
          description: >-
            The message from the last attempted run, empty when it succeeded (or
            none has been attempted yet). Cleared by the NEXT successful run, so a
            non-empty value always means "still needs attention" - poll it to
            detect a template the agent could not bill, e.g. because the
            organisation has no SMTP configured. **Read `last_run_severity`
            before calling it a failure**: some messages describe a run that DID
            produce the invoice.
        last_run_severity:
          type: string
          enum: ["", warning, error]
          readOnly: true
          description: >-
            What `last_run_error` means. Empty when there is no message; `error`
            when nothing was billed; `warning` when the invoice WAS generated,
            exported and sent and something after it needs a look. Without this,
            every message reads as a failed run.

    RecurringInvoiceInput:
      type: object
      additionalProperties: true
      description: >-
        **`document_term_id` was RETIRED.** Sending that key - with any value,
        including null or an empty string - answers 422
        `document_term_id_retired`. Use `document_template_id`.


        Note this endpoint does NOT seed a template on create: a recurring
        invoice created through v1 starts with both terms texts empty unless the
        body says otherwise. Quotes and outbound invoices are seeded from the
        organisation's default template; this one is not.
      properties:
        document_template_id:
          type: string
          writeOnly: true
          description: >-
            LOAD a document template ("Vorlage"): its `terms_text`,
            `payment_terms_text` and day count are copied onto the template,
            which then owns its own snapshot. Its days become `due_days` unless
            the same request sends an explicit one. Write-only on purpose -
            nothing records which template was used. Discover the ids with
            `GET /document-templates?kind=invoice` - note the kind is `invoice`,
            not `outbound_invoice`.
        terms_text:
          type: string
          description: >-
            Type the terms yourself; applied AFTER `document_template_id`, so
            sending both loads the template and keeps your wording. Copied onto
            every generated invoice.
        payment_terms_text:
          type: string
          description: >-
            The second terms text - the payment terms - copied onto every
            generated invoice as well, and printed after `terms_text`.
        label: { type: string }
        customer_id:
          type: string
          description: >-
            Assigning a customer applies their document defaults to the
            template. A customer from another organisation is refused with 404.
        partner_id:
          type: string
          description: >-
            Commission partner stamped onto every generated invoice - so a wrong
            value here misdirects commission repeatedly, not once. Empty clears
            it; a foreign partner is refused.
        project_id: { type: string, description: Empty clears the link. A foreign project is refused. }
        active: { type: boolean }
        interval: { type: string, enum: [daily, weekly, monthly, yearly] }
        first_run_date:
          type: string
          format: date
          description: >-
            The schedule ANCHOR - it fixes the day every future run lands on, not
            just the first. Changing it reseeds `next_run_at`.
        service_period_mode:
          type: string
          enum: [current, previous, ahead, behind, none]
          description: Which period each generated invoice states. See the output schema for what each prints.
        due_days:
          type: integer
          description: >-
            Payment term handed to each generated invoice. An explicit value beats
            the day count of a `document_template_id` in the same request.
        document_send_mode:
          type: string
          enum: ["", link, attach]
          description: Empty deliberately allowed here - see the output schema.
        payment_mode: { type: string, enum: [direct_debit, all, individual] }
        payment_methods:
          type: array
          items: { type: string, enum: [online, transfer, cash] }
        payment_method: { type: string, enum: [BANK_TRANSFER, DIRECT_DEBIT], description: LEGACY. }
        tax_label: { type: string }
        reverse_charge: { type: boolean }
        email_text: { type: string, description: Cover-mail intro for every generated invoice. }
        email_body: { type: string, description: Cover-mail body. }
        pdf_footer: { type: string }
        pdf_note: { type: string }
        reference_fields:
          type: array
          items: { $ref: "#/components/schemas/ReferenceField" }
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }

    RecurringInvoiceList:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/RecurringInvoice" }
