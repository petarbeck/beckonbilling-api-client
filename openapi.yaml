        invoice_template_id:
          type: string
          nullable: true
          description: >-
            The same for OUTBOUND INVOICES; must be a template of kind
            `invoice`. It also supplies the payment term, so assigning the
            customer moves `due_date` as well as the texts. Replaced
            `invoice_document_term_id`, which was removed.
        invoice_due_days:
          type: integer
          nullable: true
          description: >-
            Payment term in days for this customer's invoices, overriding the
