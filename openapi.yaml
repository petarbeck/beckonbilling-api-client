        invoice_terms_override:
          type: boolean
          description: Whether `invoice_terms_text` replaces the template's terms for this customer.
        invoice_terms_text:
          type: string
          description: Negotiated terms for this customer's invoices. Applied only when the switch above is true.
        invoice_payment_terms_override:
          type: boolean
          description: Whether `invoice_payment_terms_text` replaces the template's payment terms.
        invoice_payment_terms_text:
          type: string
          description: >-
            Negotiated payment terms for this customer's invoices. Applied only
            when `invoice_payment_terms_override` is true.

