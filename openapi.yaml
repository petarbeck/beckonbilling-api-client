openapi: 3.1.0
info:
  title: Beckon Billing API
  version: "1.0.0"
  description: |
    Public REST API (v1) for Beckon Billing.

    This document is the **canonical contract** for the API. It is consumed by
    the official PHP client (`beckonbilling/api-client`) and can be imported
    directly into Postman, Insomnia, or an OpenAPI code generator.

    ## Authentication

    Every request carries an API token as a bearer token:

    ```
    Authorization: Bearer bbp_<your-token>
    ```

    Two token flavours authorise through the same per-feature access model:

    - **Organisation tokens** (`bbp_...`) - created in the portal under
      *Firma -> API-Zugriff*, bound to one organisation, carry an explicit
      `{feature: none|view|full}` grant map plus the `send`/`bank` capabilities.
    - **User tokens** - minted by `POST /auth/login`; act as the signed-in user
      across all their organisations (owner = Full on every feature). Select an
      organisation per request with `?organisation=<uuid>` (optional when the
      user has exactly one).

    ## Permissions & capabilities

    Each entity maps to one member feature. Read/PDF actions need the feature at
    **View**; every mutation needs **Full**. On top of that, two boolean
    capabilities gate third-party effects, default **OFF** for everyone except
    the organisation owner:

    - `send` - emailing a customer (quote/invoice issue + send).
    - `bank` - moving money / marking paid (invoice `set-paid`).

    A missing capability returns 403 with `error.key` `send_not_permitted` /
    `bank_not_permitted`.

    Two collections are **read-only** here - `units` and `document-templates`.
    They are the organisation's vocabulary, which a caller must be able to READ
    to build a valid document; managing them stays a portal action, and every
    method but `GET` answers 405. `units` is readable with View on any one of
    `articles`, `quotes`, `outbound_invoices` or `recurring_invoices`;
    `document-templates` with View on `quotes` or `outbound_invoices`, and its
    rows are filtered to the kinds that token may actually view.


    **`/document-terms` was REMOVED** and now answers 404;
    `/document-templates` replaced it, and the input key `document_term_id`
    answers 422 `document_term_id_retired` in favour of `document_template_id`.

    ## Conventions

    - **IDs** are opaque UUID strings; integer ids are never exposed. (One
      exception, flagged where it occurs: `RecurringInvoice.document_ids`.)
    - **Lists** are paginated (`limit` default 100, max 500) and return
      `{ data, total, limit, offset }`.
    - **Creating answers 201**; reading, updating and every action answer 200.
      Deleting answers 200 with `{ "deleted": true }`.
    - **Updates are partial.** A `PUT` applies the keys it recognises and leaves
      the rest of the record alone; a key it does not read is silently ignored
      (see strict mode below).
    - **Dates** are ISO-8601: calendar-day fields (`issue_date`, `due_date`,
      `valid_until`, `first_run_date`) are `YYYY-MM-DD`; timestamps are full
      offset datetimes. Unset dates are `null`.
    - **Amounts** are decimal net numbers; `tax_percent` is a percentage.
    - **Errors** have the shape `{ "error": { code, message, key } }`; branch on
      the stable `key`.

    ## Strict mode (`?strict=1`)

    Append `?strict=1` to any `POST`/`PUT` and an unrecognised body key answers
    **400 `unrecognised_keys`**, naming the offenders, instead of being silently
    discarded. Opt-in, so no existing client can break, and worth turning on in
    development: the default behaviour cannot tell "saved" from "dropped", which
    is how a renamed field can cost weeks of silent data loss.

    Two caveats, both real:

    - It checks the request's SHAPE only, and runs BEFORE authentication - so it
      also works on `POST /auth/login`, which has no token yet.
    - It **silently does nothing on `/articles` and `/article-categories`**.
      Those two endpoints declare no key list, and a global flag must not turn
      an undeclared endpoint into a hard failure. Every other entity here is
      covered, so do not read a pass on those two as a validated request.

    ## Units are a vocabulary, not free text

    A position's `unit`, and an article's, is matched against the
    organisation's units (`GET /units`). The reason is the printed document: a
    unit is inflected once the quantity leaves 1 ("12 Monate"), and only a
    vocabulary entry carries the plural form to inflect to.

    A unit the organisation does not stock yet is **added to its vocabulary**,
    not refused - send `unit_plural` alongside if it inflects, or the new entry
    is created without one and prints unchanged. Matching is trimmed and
    case-insensitive, and **the stored value is the vocabulary's spelling**, so
    sending `stk.` against a vocabulary holding `Stk.` reads back as `Stk.`
    rather than creating a second entry. The only refusal is a value too long to
    be a unit at all (over 32 characters, **422 `unit_too_long`**).
  license:
    name: MIT
    url: https://github.com/petarbeck/beckonbilling-api-client/blob/main/LICENSE
  contact:
    name: Beckon Billing
    url: https://www.beckonbilling.com

servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: portal.beckonbilling.com
        description: Your Beckon Billing portal host.

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: User-token authentication (no organisation scope).
  - name: Customers
  - name: Article categories
  - name: Articles
  - name: Units
    description: The organisation's unit vocabulary. Read-only.
  - name: Document templates
    description: Document templates ("Vorlagen"). Read-only. Replaced "Document terms".
  - name: Quotes
  - name: Outbound invoices
  - name: Recurring invoices

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Self-registration (pending account + activation email)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                language: { type: string, example: de }
      responses:
        "200":
          description: Registration accepted.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "422": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in and mint a user token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                tfa_code: { type: string, description: TOTP, recovery, or emailed fallback code. }
                remember_device: { type: boolean }
                device_token: { type: string, description: A previously issued 30-day trusted-device token. }
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
                  device_token: { type: string, nullable: true }
                  user: { type: object, additionalProperties: true }
                  organisations:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401":
          description: Bad credentials, or `error.key = tfa_required` until a `tfa_code` is supplied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user + accessible organisations (session restore)
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Error" }

  /customers:
    get:
      tags: [Customers]
      summary: List customers
      parameters:
        - $ref: "#/components/parameters/organisation"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of customers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [Customers]
      summary: Create a customer
      parameters: [ { $ref: "#/components/parameters/organisation" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "201":
          description: The created customer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "422": { $ref: "#/components/responses/Error" }

  /customers/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "#/components/parameters/organisation"
    get:
      tags: [Customers]
      summary: Read one customer
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Customers]
      summary: Update a customer (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "200":
          description: The updated customer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
    delete:
      tags: [Customers]
      summary: Soft-delete a customer
      responses:
        "200": { description: Deleted. }

  /article-categories:
    get:
      tags: [Article categories]
      summary: List article categories
      parameters:
        - $ref: "#/components/parameters/organisation"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of categories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleCategoryList" }
    post:
      tags: [Article categories]
      summary: Create a category
      parameters: [ { $ref: "#/components/parameters/organisation" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                NOTE: `?strict=1` does NOT validate this endpoint's body - it
                declares no key list, so an unrecognised key is silently
                discarded here even with the flag on.
              properties:
                label: { type: string }
                fibu_code: { type: string }
      responses:
        "201":
          description: The created category.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleCategory" }

  /article-categories/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "#/components/parameters/organisation"
    get:
      tags: [Article categories]
      summary: Read one category
      responses:
        "200":
          description: The category.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleCategory" }
    put:
      tags: [Article categories]
      summary: Update a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                NOTE: `?strict=1` does NOT validate this endpoint's body - it
                declares no key list, so an unrecognised key is silently
                discarded here even with the flag on.
              properties:
                label: { type: string }
                fibu_code: { type: string }
      responses:
        "200":
          description: The updated category.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleCategory" }
    delete:
      tags: [Article categories]
      summary: Soft-delete a category
      responses:
        "200": { description: Deleted. }

  /articles:
    get:
      tags: [Articles]
      summary: List articles
      parameters:
        - $ref: "#/components/parameters/organisation"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of articles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleList" }
    post:
      tags: [Articles]
      summary: Create an article
      parameters: [ { $ref: "#/components/parameters/organisation" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleInput" }
      responses:
        "201":
          description: The created article.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }

  /articles/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "#/components/parameters/organisation"
    get:
      tags: [Articles]
      summary: Read one article
      responses:
        "200":
          description: The article.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
    put:
      tags: [Articles]
      summary: Update an article (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleInput" }
      responses:
        "200":
          description: The updated article.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
    delete:
      tags: [Articles]
      summary: Soft-delete an article
      responses:
        "200": { description: Deleted. }

  /articles/{id}/variants:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "#/components/parameters/organisation"
    get:
      tags: [Articles]
      summary: List an article's variants
      description: >-
        The variants of one article. A variant only has meaning together with
        its article, which is why it is a sub-collection rather than an entity
        of its own. Needs the `articles` feature at view.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of variants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleVariantList" }
    post:
      tags: [Articles]
      summary: Create a variant of this article
      description: Needs the `articles` feature at full.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleVariantInput" }
      responses:
        "201":
          description: The created variant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleVariant" }

  /articles/{id}/variants/{variantId}:
    parameters:
      - $ref: "#/components/parameters/id"
      - name: variantId
        in: path
        required: true
        schema: { type: string }
        description: The variant uuid. It must belong to the article in the path.
      - $ref: "#/components/parameters/organisation"
    put:
      tags: [Articles]
      summary: Update a variant (partial)
      description: >-
        Needs the `articles` feature at full. Pass `null` for a field to clear
        the override and inherit the article's value again. There is
        deliberately no DELETE: a variant a document already used is retired in
        the portal, and the document keeps the values and the label it
        snapshotted either way.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleVariantInput" }
      responses:
        "200":
          description: The updated variant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleVariant" }

  /units:
    get:
      tags: [Units]
      summary: List the organisation's unit vocabulary
      description: >-
        The short forms a position's `unit` (and an article's) resolves
        against. A value outside this list is ADDED to it rather than refused,
        so reading it first is how you avoid growing the vocabulary by accident
        - and how you learn the spelling the server will store.


        Readable with View on ANY ONE of `articles`, `quotes`,
        `outbound_invoices` or `recurring_invoices` - a token that may write a
        document has to be able to read the vocabulary its documents are checked
        against, and a unit ("Stk.", "h") discloses nothing such a token cannot
        already read off the documents themselves.
      parameters:
        - $ref: "#/components/parameters/organisation"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of units.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitList" }
        "403": { $ref: "#/components/responses/Error" }
        "405":
          description: Read-only - every method but GET is refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /units/{id}:
    get:
      tags: [Units]
      summary: Read one unit
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/organisation"
      responses:
        "200":
          description: The unit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unit" }
        "404": { $ref: "#/components/responses/Error" }

  /document-templates:
    get:
      tags: [Document templates]
      summary: List document templates ("Vorlagen")
      description: >-
        Where the ids for the write-only `document_template_id` input come from,
        together with the two terms texts and the day count each one would apply.


        This replaced `/document-terms`, which was removed. A template is the
        bigger thing a terms preset used to be a part of: besides the wording and
        the days it also carries the printed footer, the cover-mail text, the
        attachments a new document starts with, and - per kind - the quote's
        default down payment or the invoice's bank details. **The organisation's
        default template IS its document setting**, which is why those fields
        moved off the organisation and onto this record.


        Readable with View on `quotes` or `outbound_invoices`, and the ROWS are
        filtered to the kinds this token may actually view - a quotes-only token
        never receives the invoice templates. Asking for a `kind` it cannot view
        answers an EMPTY LIST rather than 403, which would leak that the other
        kind exists.
      parameters:
        - $ref: "#/components/parameters/organisation"
        - name: kind
          in: query
          required: false
          description: >-
            Restrict to one document type. Note the value is `invoice`, NOT
            `outbound_invoice` - the kind `/document-terms` used.
          schema: { type: string, enum: [quote, invoice] }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of templates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentTemplateList" }
        "403": { $ref: "#/components/responses/Error" }
        "405":
          description: Read-only - every method but GET is refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /document-templates/{id}:
    get:
      tags: [Document templates]
      summary: Read one document template
      description: >-
        A template of a kind this token may not view answers the same 404
        `document_template_not_found` as an unknown or foreign id.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/organisation"
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentTemplate" }
        "404": { $ref: "#/components/responses/Error" }

  /quotes:
    get:
      tags: [Quotes]
      summary: List quotes
      parameters:
        - $ref: "#/components/parameters/organisation"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of quotes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteList" }
    post:
      tags: [Quotes]
      summary: Create a draft quote
      parameters: [ { $ref: "#/components/parameters/organisation" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteInput" }
      responses:
        "201":
          description: The created draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }

  /quotes/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "#/components/parameters/organisation"
    get:
      tags: [Quotes]
      summary: Read one quote (incl. positions)
      responses:
        "200":
          description: The quote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
    put:
      tags: [Quotes]
      summary: Update a quote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteInput" }
      responses:
        "200":
          description: The updated quote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
    delete:
      tags: [Quotes]
      summary: Soft-delete a quote
      responses:
        "200": { description: Deleted. }

  /quotes/{id}/issue:
    post:
      tags: [Quotes]
      summary: Issue a draft (assigns the number)
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/organisation"
      responses:
        "200":
          description: >-
            The issued quote, plus `detached_positions` when any line lost a
            retired catalog reference on the way through.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Quote"
                  - type: object
                    properties:
                      detached_positions: { $ref: "#/components/schemas/DetachedPositions" }

  /quotes/{id}/send:
    post:
      tags: [Quotes]
      summary: Email the quote (requires the `send` capability)
      description: >-
        Issues drafts first and resets a won/lost quote back to issued.


        **The body is an envelope, not a bare quote** - unlike every other quote
        action, this answers `{ sent_to, quote }`. A quote with no recipient
        address and no customer to fall back on is refused with 422
        `recipient_email_missing`; a mail failure is 502 `mail_send_failed`
        (unlike an invoice issue, which sends best-effort and reports
        `send_error` on a 200).
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/organisation"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                document_ids:
                  type: array
                  items: { type: string }
                  description: Override the attached documents for this send (empty = attach none).
      responses:
        "200":
          description: Where it went, and the quote as it now stands.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent_to: { type: string, description: The address it was mailed to. }
                  quote: { $ref: "#/components/schemas/Quote" }
                  detached_positions: { $ref: "#/components/schemas/DetachedPositions" }
        "403":
          description: Missing `send` capability (`error.key = send_not_permitted`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: No recipient address (`error.key = recipient_email_missing`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The mail could not be sent (`error.key = mail_send_failed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /quotes/{id}/convert:
    post:
      tags: [Quotes]
      summary: Create a draft invoice from the quote
      description: >-
        Requires `quotes` Full and `outbound_invoices` Full.

        A quote whose lines are ALL `billing_mode: recurring` has no one-time
        invoice to create and is refused with 409 `quote_is_recurring_only` - it
        converts to a recurring invoice, which this v1 action does not create.
        Use the portal for a mixed or recurring-only quote.


        **`scope` decides WHICH invoice this creates** - the whole thing, a down
        payment, or the remainder. Omitting it keeps the behaviour this action
        has always had. See `OutboundInvoice.invoice_scope` for how a down
        payment and a final invoice add up.


        Refusals worth handling, all by `error.key`: `invoice_scope_unknown`
        (422, a `scope` outside the three values); `customer_required` (409);
        `quote_has_no_positions` (409); `quote_is_recurring_only` (409);
        `quote_already_invoiced` (409); and, for the two staged scopes,
        `quote_has_no_deposit` (422, `scope=deposit` on a quote carrying none),
        `quote_deposit_base_empty` (422), `deposit_invoice_exists` (409),
        `quote_has_deposit_invoice` (409, `scope=full` once a down payment
        exists - the rest belongs on a final invoice), `no_deposit_invoice`
        (409, `scope=final` with no ISSUED down payment to deduct),
        `quote_has_draft_invoice` (409, issue or delete it first) and
        `final_invoice_exists` (409).
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/organisation"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  enum: [full, deposit, final]
                  default: full
                  description: >-
                    Which invoice to create. `full` bills the whole one-time
                    part, as this action always did - omitting `scope`, or
                    sending null or an empty string, means exactly that.
                    `deposit` bills only the quote's down payment; `final` bills
                    the remainder, deducting an already-issued down payment.
                    Anything else is 422 `invoice_scope_unknown` - it is refused
                    rather than coerced, because falling back to `full` would
                    silently bill the entire amount.
      responses:
        "201":
          description: The new invoice id + the (converted) quote.
          content:
            application/json:
              schema:
                type: object
                properties:
                  outbound_invoice_id: { type: string }
                  quote: { $ref: "#/components/schemas/Quote" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /quotes/{id}/pdf:
    get:
      tags: [Quotes]
      summary: Download the final PDF (409 for drafts)
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/organisation"
      responses:
        "200":
          description: The PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "409": { $ref: "#/components/responses/Error" }

  /outbound-invoices:
    get:
      tags: [Outbound invoices]
      summary: List invoices
      parameters:
        - $ref: "#/components/parameters/organisation"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - { name: status, in: query, schema: { type: string, enum: [draft, issued] } }
        - { name: paid, in: query, schema: { type: integer, enum: [0, 1] } }
        - { name: sent, in: query, schema: { type: integer, enum: [0, 1] } }
        - { name: cancelled, in: query, schema: { type: integer, enum: [0, 1] } }
        - { name: customer_id, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: Free-text search. }
      responses:
        "200":
          description: A page of invoices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutboundInvoiceList" }
    post:
      tags: [Outbound invoices]
      summary: Create a draft invoice
      parameters: [ { $ref: "#/components/parameters/organisation" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutboundInvoiceInput" }
      responses:
        "201":
          description: The created draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutboundInvoice" }

  /outbound-invoices/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "#/components/parameters/organisation"
    get:
      tags: [Outbound invoices]
      summary: Read one invoice (incl. positions)
      responses:
        "200":
          description: The invoice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutboundInvoice" }
    put:
      tags: [Outbound invoices]
      summary: Update a draft (full) or an issued invoice (limited fields)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutboundInvoiceInput" }
      responses:
        "200":
          description: The updated invoice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutboundInvoice" }
    delete:
      tags: [Outbound invoices]
      summary: Delete a draft (409 for issued - cancel instead)
      responses:
        "200": { description: Deleted. }
        "409": { $ref: "#/components/responses/Error" }

  /outbound-invoices/{id}/issue:
    post:
      tags: [Outbound invoices]
      summary: Issue the draft and auto-send it (requires the `send` capability)
      description: >-
        Assigns the number, exports the PDF, mints the online payment link and
        mails it to the customer.


        **Three of those are best-effort and never fail the issue, so read the
        result rather than the status code.** `send_error` means the mail did
        not go out. `payment_link_error` means the invoice offers online payment
        with no Stripe link behind it - the customer has no way to pay the way
        the document tells them to. `detached_positions` means a line lost a
        retired catalog reference; no figure changed, but it is reported rather
        than done silently. Each key is present ONLY when that thing happened.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/organisation"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                document_ids: { type: array, items: { type: string } }
      responses:
        "200":
          description: The issued invoice, plus any side effect that did not succeed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OutboundInvoice"
                  - type: object
                    properties:
                      send_error:
                        type: string
                        description: Present only when mailing the customer failed. The invoice IS issued.
                      payment_link_error:
                        type: string
                        description: >-
                          Present only when minting the Stripe payment link failed. The invoice IS
                          issued, but its online payment option has no link behind it.
                      auto_matched:
                        type: integer
                        description: >-
                          How many existing bank transactions were matched to this invoice as it was
                          issued (the customer had already paid). Present only when at least one was.
                      detached_positions: { $ref: "#/components/schemas/DetachedPositions" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: Not a draft, or it has no positions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /outbound-invoices/{id}/send:
    post:
      tags: [Outbound invoices]
      summary: (Re-)send an issued invoice (requires the `send` capability)
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/organisation"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                document_ids: { type: array, items: { type: string } }
      responses:
        "200":
          description: The sent invoice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutboundInvoice" }
        "403": { $ref: "#/components/responses/Error" }

  /outbound-invoices/{id}/cancel:
    post:
      tags: [Outbound invoices]
      summary: Cancel an issued invoice (creates the credit note)
      description: >-
        Answers the **credit note that was created**, not the invoice that was
        cancelled - read `cancels_outbound_invoice_id` on it to name the other
        half.


        Cancelling an invoice that never received money settles that credit note
        automatically: the pair nets to zero and nobody will ever pay it.
        Cancelling one that was paid even in part deliberately leaves it OPEN,
        because that is a real refund owed to the customer.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/organisation"
      responses:
        "200":
          description: The newly created credit note.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutboundInvoice" }
        "409":
          description: A draft (delete it instead), or already cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /outbound-invoices/{id}/set-paid:
    put:
      tags: [Outbound invoices]
      summary: Record / remove an untracked payment (requires the `bank` capability)
      description: >
        `true` records an untracked payment over the open amount; `false`
        removes the paid mark and is refused (409) while transaction-linked
        payments exist.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/organisation"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paid]
              properties:
                paid: { type: boolean }
      responses:
        "200":
          description: The invoice with recomputed paid state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutboundInvoice" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /outbound-invoices/{id}/pdf:
    get:
      tags: [Outbound invoices]
      summary: Download the final PDF (409 for drafts)
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/organisation"
      responses:
        "200":
          description: The PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "409": { $ref: "#/components/responses/Error" }

  /recurring-invoices:
    get:
      tags: [Recurring invoices]
      summary: List recurring invoices
      parameters:
        - $ref: "#/components/parameters/organisation"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: A page of recurring invoices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringInvoiceList" }
    post:
      tags: [Recurring invoices]
      summary: Create a recurring invoice
      parameters: [ { $ref: "#/components/parameters/organisation" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurringInvoiceInput" }
      responses:
        "201":
          description: The created recurring invoice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringInvoice" }

  /recurring-invoices/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "#/components/parameters/organisation"
    get:
      tags: [Recurring invoices]
      summary: Read one recurring invoice
      responses:
        "200":
          description: The recurring invoice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringInvoice" }
    put:
      tags: [Recurring invoices]
      summary: Update a recurring invoice (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurringInvoiceInput" }
      responses:
        "200":
          description: The updated recurring invoice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringInvoice" }
    delete:
      tags: [Recurring invoices]
      summary: Soft-delete a recurring invoice
      responses:
        "200": { description: Deleted. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An organisation token (`bbp_...`) or a user token.

  parameters:
    organisation:
      name: organisation
      in: query
      required: false
      description: Organisation UUID. Required for user tokens with more than one organisation.
      schema: { type: string }
    id:
      name: id
      in: path
      required: true
      description: The resource UUID.
      schema: { type: string }
    limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 100, maximum: 500, minimum: 1 }
    offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, default: 0, minimum: 0 }

  responses:
    Error:
      description: Error envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: integer }
            message: { type: string }
            key: { type: string, description: Stable slug to branch on. }

    Pagination:
      type: object
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    Position:
      type: object
      description: A document line item.
      properties:
        title: { type: string }
        description: { type: string }
        quantity: { type: number }
        price: { type: number, description: Net unit price. }
        tax_percent: { type: number, description: Percentage, e.g. 20. }
        article_id: { type: string, nullable: true, description: Source catalog article UUID (0/absent for free text). }
        article_variant_id:
          type: string
          nullable: true
          description: >-
            Variant of that article this line was priced from, or absent for a
            plain article line. A variant is a named set of OVERRIDES on the
            article (see `GET /articles/{id}/variants`); picking one takes its
            values instead of the article's own.
        variant_label:
          type: string
          description: >-
            The variant's name at the moment the line was written, SNAPSHOTTED
            like the price. Deleting or renaming the variant later never changes
            what a document says was sold. Resolved server-side - name
            `article_variant_id` and leave this empty to have it filled in.
        supply_type:
          type: string
          enum: ["", service, goods]
          description: >-
            Whether this line is a service or goods. It decides which sentence a
            cross-border document prints: within the EU a service line carries
            the reverse-charge note and a goods line the intra-community supply
            note; outside it, "not taxable at the recipient's place" against an
            export delivery. Empty behaves as `service`.
        fibu_code: { type: string, nullable: true }
        discount_type: { type: string, enum: [none, percent, amount], default: none }
        discount_value: { type: number, description: Percent 0-100 for `percent`, else a EUR amount. }
        commission_eligible: { type: boolean }
        unit:
          type: string
          description: >-
            Short unit printed after the quantity, e.g. "h", "Stk.". Resolved
            against the organisation's units (`GET /units`), because only a
            vocabulary entry carries the plural form the document inflects to.


            A unit the organisation does not stock yet is ADDED to its
            vocabulary rather than refused, carrying whatever `unit_plural` you
            sent with it (without one it is created as a unit that does not
            inflect, and prints unchanged). **Read back what you get**: matching
            is trimmed and case-insensitive, and the value stored is the
            VOCABULARY'S spelling, so `stk.` against a vocabulary holding `Stk.`
            comes back as `Stk.` instead of becoming a second entry for the same
            unit. Omitting it is normal - the value then falls back to the named
            article's unit and then to the organisation's default. The only
            refusal is a value that cannot be a unit at all: over 32 characters
            answers **422 `unit_too_long`**, because storing it would truncate
            silently.
        unit_plural:
          type: string
          description: >-
            Form printed once the quantity leaves 1 ("12 Monate"). Empty means the
            unit does not inflect ("8 h") and `unit` prints unchanged. Snapshotted
            on the position, so renaming or deleting a unit never re-inflects an
            issued document. Resolved server-side - send `unit` and leave this
            empty to have it filled in.
        billing_mode:
          type: string
          enum: [one_time, recurring]
          default: one_time
          description: >-
            Whether the line is a single charge or a fee that repeats. Meaningful
            on QUOTES: a quote can offer one-time and recurring work together, and
            its summary is split per modality rather than printing one combined
            total. Converting such a quote produces an invoice for the one-time
            lines AND a recurring invoice per interval. Defaults to `one_time`, so
            omitting it reproduces the previous behaviour exactly.
        recurring_interval:
          type: string
          enum: [monthly, quarterly, yearly]
          description: >-
            Only meaningful while `billing_mode` is `recurring`; empty otherwise.
            Defaults to `monthly` if a recurring line names none.
        line_net:
          type: number
          readOnly: true
          description: >-
            Line total after its discount. Read-only and authoritative - do NOT
            re-derive it as `quantity * price`, which is wrong for any line
            carrying a discount.
        line_tax:
          type: number
          readOnly: true
          description: VAT for this line, computed on the DISCOUNTED net.
        line_gross:
          type: number
          readOnly: true
          description: line_net + line_tax.

    Recipient:
      type: object
      properties:
        type: { type: string, enum: [business, consumer] }
        company_name: { type: string }
        attention: { type: string }
        salutation: { type: string }
        person_name: { type: string, description: "Full name of a consumer (private person), as ONE field. Replaced first_name/last_name in 0.7.0." }
        address: { type: string }
        zip: { type: string }
        city: { type: string }
        country: { type: string, description: ISO-2 country code. }
        vat_id: { type: string }
        email: { type: string }
        additional: { type: string }

    ReferenceField:
      type: object
      properties:
        label: { type: string }
        value: { type: string }

    DetachedPositions:
      type: array
      readOnly: true
      description: >-
        Lines whose catalog reference was dropped as the document was issued,
        because the article behind it had been retired. Nothing about the line's
        money changes - the position carries its own snapshot of everything that
        prints - but it is reported rather than done silently. Present only when
        it happened.
      items:
        type: object
        properties:
          position: { type: integer, description: 1-based index of the line. }
          title: { type: string }

    Unit:
      type: object
      additionalProperties: true
      description: >-
        A unit of measure from the organisation's vocabulary. Read-only here,
        and the list a position's `unit` is validated against.
      properties:
        id: { type: string }
        short:
          type: string
          description: >-
            The printed short form, e.g. "h", "Stk.", "Monat". THIS is what a
            position's or article's `unit` must match (case-insensitively).
        plural:
          type: string
          description: >-
            The form printed once the quantity leaves 1, e.g. "Monate". Empty
            means the unit does not inflect ("8 h"). Its existence is the reason
            units are a managed vocabulary rather than free text.
        label: { type: string, description: The long human name, e.g. "Stunde". }
        display_label: { type: string, readOnly: true, description: What the portal's pickers show. }
        position: { type: integer, description: Sort order within the vocabulary. }

    UnitList:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Unit" }

    DocumentTemplate:
      type: object
      additionalProperties: true
      description: >-
        A document template ("Vorlage"). Read-only here, and where the ids for
        the write-only `document_template_id` input come from. Sending that id
        LOADS this template's two terms texts and its days onto a document, which
        then owns its own snapshot - editing or deleting the template never
        changes a document that already exists.


        Replaced `DocumentTerm` (see `GET /document-templates`).
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [quote, invoice]
          description: >-
            Which document type this template belongs to. **`invoice`, not
            `outbound_invoice`** - the kinds differ from the removed
            `/document-terms`, so a value copied from older code is unknown.
            Naming a template of the wrong kind on a document is refused with 404
            `document_template_not_found`.
        label: { type: string, description: What this template is called in the portal. }
        is_default:
          type: boolean
          description: >-
            Whether a new document of this kind starts from this template. At
            most one per organisation and kind - and since the last template of a
            kind cannot be deleted, a default always exists.
        terms_text:
          type: string
          description: >-
            The document's own terms, snapshotted onto it as `terms_text`. The
            portal labels this "Angebotsbedingungen" on a quote and
            "Rechnungsbedingungen" on an invoice.
        payment_terms_text:
          type: string
          description: >-
            The payment terms, snapshotted onto the document as
            `payment_terms_text` and printed AFTER `terms_text`. Labelled
            "Anzahlungsbedingungen" on a quote and "Zahlungsbedingungen" on an
            invoice.
        days:
          type: integer
          description: >-
            Validity (quote) or payment term (invoice) in days. **0 is a real
            value** meaning due immediately. Applying the template moves the
            document's `valid_until` / `due_date` by this many days from its
            issue date. With no template at all the fallback is 30 days for a
            quote and 14 for an invoice.
        footer: { type: string, description: The footer printed on documents started from this template. }
        email_body: { type: string, description: The cover-mail text those documents are sent with. }
        document_ids:
          type: array
          items: { type: string }
          description: >-
            Uuids of the documents a new document of this kind starts with
            attached. Carried at CREATION only - naming a template on an existing
            document loads its texts and days, never its attachments.
        deposit_type:
          type: string
          enum: [none, percent, amount, goods_percent, service_percent]
          description: The down payment a new QUOTE starts with. Meaningless on an invoice template.
        deposit_value: { type: number, description: See `Quote.deposit_value`. }
        bank_mode:
          type: string
          description: >-
            How the bank details print on an INVOICE from this template.
            Meaningless on a quote template - a quote no longer carries bank
            details at all; a down payment invoice is what asks for money now.
        bank_text: { type: string, description: Free-text bank details, used when `bank_mode` says so. }
        bank_account_id:
          type: string
          description: Uuid of the bank account those invoices print. Empty when none is designated.
        can_delete:
          type: boolean
          description: >-
            False for the last template of its kind, which cannot be deleted -
            every document resolution needs one to fall back to.
        created_at: { type: string, format: date-time, nullable: true }

    DocumentTemplateList:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/DocumentTemplate" }

    Customer:
      type: object
      additionalProperties: true
      properties:
        payment_mode:
          type: string
          enum: [direct_debit, all, individual]
          description: >-
            How this record is settled. `direct_debit` means WE collect it under
            a SEPA mandate and no way to pay is offered at all; `all` means the
            customer pays by the organisation's standard setting; `individual`
            means they pay by the ways in `payment_methods`. Direct debit is
            deliberately not one of `payment_methods` - it is the level above
            them, so "collect and also offer a transfer" cannot be expressed.
        payment_methods:
          type: array
          items: { type: string, enum: [online, transfer, cash] }
          description: >-
            The individual selection, used when `payment_mode` is `individual`.
            Kept when the mode is anything else, so a record returns to these
            ways if a mandate is revoked. Online payment is only ever offered
            when the organisation has a working Stripe configuration.
        id: { type: string }
        created_by: { type: string, format: uuid, nullable: true, readOnly: true, description: "Uuid of the user who created this record; null = system-generated (e.g. an automated import)." }
        created_by_name: { type: string, readOnly: true, description: "Display name of the creator; empty string when created_by is null." }
        display_name: { type: string, readOnly: true, description: "Der anzuzeigende Name: bei einer Firma company_name, bei einer Privatperson salutation + person_name. Ersetzt das entfallene 'label'." }
        customer_type: { type: string, enum: [business, consumer] }
        company_name: { type: string }
        attention: { type: string }
        salutation: { type: string }
        person_name: { type: string, description: "Full name of a consumer (private person), as ONE field. Replaced first_name/last_name in 0.7.0." }
        homepage: { type: string, description: "Website of this customer, stored without the scheme (e.g. `www.example.at`)." }
        imprint_url: { type: string, description: "Imprint URL. Informational only - never printed on a document." }
        privacy_url: { type: string, description: "Privacy policy URL. Informational only." }
        address: { type: string }
        zip: { type: string }
        city: { type: string }
        country: { type: string, description: ISO-2 country code. }
        vat_id: { type: string, description: UID / VAT number, printed on the document. }
        additional: { type: string, description: Free-form extra address lines. }
        email: { type: string, description: General address. `recipient_email` is what documents are sent to. }
        customer_info: { type: string, readOnly: true, description: The composed address block, as printed. }
        recipient_email: { type: string, description: Where this customer's documents are sent. }
        recipient_email_name: { type: string }
        cc_email: { type: string }
        cc_email_name: { type: string }
        bank_account_holder: { type: string }
        bank_iban:
          type: string
          description: >-
            Kept grouped and printed as stored. Only the CHARACTER SET is
            validated (A-Z, 0-9, spaces) - 422 `iban_invalid_characters`
            otherwise - deliberately not the full IBAN structure, because this
            field also legitimately holds a US account number.
        bank_bic: { type: string }
        document_send_mode:
          type: string
          enum: ["", link, attach]
          description: >-
            How this customer's documents reach them: a link to the public page,
            or the PDF attached. **A customer is the ONE level that may leave
            this empty** ("platform default") - it is a live rule, so an empty
            value defers to the organisation. A quote or invoice always resolves
            it to a concrete value at creation, because a document is the record
            of what was decided for it.
        partner_id: { type: string, nullable: true, description: Commission partner stamped onto this customer's documents. }
        partner_commission_percent:
          type: number
          description: "-1 = inherit the partner profile's own rate; >= 0 = a per-customer override."
        hourly_rate:
          type: number
          nullable: true
          description: Null = inherit the organisation's rate. 0 is a real rate meaning free.
        inherited_rate: { type: number, readOnly: true, description: What hourly_rate would resolve to with no override. }
        payment_method:
          type: string
          readOnly: true
          description: LEGACY. Read `payment_mode` + `payment_methods` instead.
        contacts:
          type: array
          description: >-
            Contact people. Replaced the flat contact_name / contact_email /
            contact_phone trio; phones are E.164, e.g. "+436601791301".
          items:
            type: object
            properties:
              type: { type: string }
              name: { type: string }
              email: { type: string }
              phone: { type: string }
        reverse_charge: { type: boolean }
        balance: { type: number, description: Signed; positive = customer holds credit. }
        risk_level: { type: integer, description: Read-only dunning risk indicator. }
        quote_template_id:
          type: string
          nullable: true
          description: >-
            Document template applied to a QUOTE when this customer is assigned
            to one. A default, not a snapshot: the document takes its own copy,
            so editing the customer never rewrites a document that already
            exists. Must be a template of kind `quote` belonging to the same
            organisation - unknown, foreign and wrong-kind ids all answer 404
            `document_template_not_found`. Null = no customer default; the
            organisation's default template applies instead.


            Replaced `quote_document_term_id`, which was removed.
        quote_valid_days:
          type: integer
          nullable: true
          description: >-
            Validity in days for this customer's quotes, overriding the
            template's own day count. **Null means inherit** - not 0, which is a
            legitimate value meaning "expires the same day". Send null (or an
            empty string) to clear an override.
        quote_terms_override:
          type: boolean
          description: >-
            Whether `quote_terms_text` below replaces the template's terms for
            this customer. **A real switch, not "the text is non-empty"** - on
