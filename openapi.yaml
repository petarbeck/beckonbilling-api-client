            all for this customer", which a text-is-empty test cannot express.
        quote_terms_text:
          type: string
          description: >-
            Negotiated terms for this customer's quotes. Applied only when
            `quote_terms_override` is true.
        quote_payment_terms_override:
          type: boolean
          description: The same switch for the second terms text below.
        quote_payment_terms_text:
          type: string
          description: >-
            Negotiated down-payment terms for this customer's quotes. Applied
