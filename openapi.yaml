        invoice_terms_text:
          type: string
          description: Optional negotiated wording for this customer's invoices.
        invoice_due_days:
          type: integer
          nullable: true
          description: >-
            Payment term in days for this customer's invoices, overriding the
            preset's. **Null means inherit**; 0 is a real value meaning due
            immediately.

